# The checks that used to live in scripts/test.sh: the svelte type check, the
# vitest suite, the playwright smoke test, rust formatting and cargo check.
#
# The frontend and the rust checks are separate jobs on purpose. Only the rust
# side needs the webkitgtk headers, so the fast checks no longer queue behind
# apt.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend checks
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install the node packages
        run: npm ci --no-audit --no-fund

      - name: Install the browser
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium

      - name: Type check the frontend
        run: npm run check

      - name: Run the frontend tests
        run: npm run test

      - name: Build the frontend
        run: npm run build

      - name: Run the smoke test
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  rust:
    name: rust checks
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      # Only what pkg-config needs to resolve the tauri crate. The icon and
      # tray libraries are a bundling concern, so they live in package-build.
      - name: Install the libraries tauri builds against
        timeout-minutes: 10
        uses: ./.github/actions/apt-deps
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install the node packages
        run: npm ci --no-audit --no-fund

      # tauri_build reads src-tauri/dist, which is not in the repo
      - name: Build the frontend
        run: npm run build

      - name: Add rustfmt
        run: rustup component add rustfmt

      - name: Cache the cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Check rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Build the rust backend
        run: cargo check --manifest-path src-tauri/Cargo.toml
