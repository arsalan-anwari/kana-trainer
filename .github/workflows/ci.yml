# The checks that used to live in scripts/test.sh: the svelte type check, the
# vitest suite, the playwright smoke test, rust formatting and cargo check.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: checks
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install the libraries tauri builds against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev librsvg2-dev \
            libayatana-appindicator3-dev libasound2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Add rustfmt
        run: rustup component add rustfmt

      - name: Cache the cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install the node packages
        run: npm ci --no-audit --no-fund

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Type check the frontend
        run: npm run check

      - name: Run the frontend tests
        run: npm run test

      - name: Build the frontend
        run: npm run build

      - name: Run the smoke test
        run: npx playwright test

      - name: Check rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Build the rust backend
        run: cargo check --manifest-path src-tauri/Cargo.toml
