# Builds one installable package per matrix entry.

name: package build

on:
  workflow_call:
    inputs:
      targets:
        description: 'JSON array of package names, for example ["deb","apk"]'
        type: string
        required: true
      require_signing_key:
        description: 'Fail the apk build unless the real android signing key is available'
        type: boolean
        required: false
        default: false
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Turn the target names into matrix entries
        id: plan
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          cat > catalog.json <<'JSON'
          {
            "deb":      { "name": "deb",      "os": "ubuntu-24.04",   "kind": "tauri",   "rust": true, "bundle": "deb",  "glob": "src-tauri/target/release/bundle/deb/*.deb" },
            "rpm":      { "name": "rpm",      "os": "ubuntu-24.04",   "kind": "tauri",   "rust": true, "bundle": "rpm",  "glob": "src-tauri/target/release/bundle/rpm/*.rpm" },
            "exe":      { "name": "exe",      "os": "windows-latest", "kind": "tauri",   "rust": true, "bundle": "nsis", "glob": "src-tauri/target/release/bundle/nsis/*-setup.exe" },
            "dmg":      { "name": "dmg",      "os": "macos-14",       "kind": "tauri",   "rust": true, "bundle": "dmg",  "glob": "src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg" },
            "msix":     { "name": "msix",     "os": "windows-latest", "kind": "msix",    "rust": true, "glob": "dist/packages/*.msix" },
            "arch":     { "name": "arch",     "os": "ubuntu-24.04",   "kind": "arch",    "glob": "dist/packages/*.pkg.tar.zst" },
            "apk":      { "name": "apk",      "os": "ubuntu-24.04",   "kind": "apk",     "rust": true, "glob": "dist/packages/*.apk" }
          }
          JSON

          unknown="$(jq -r --argjson want "$TARGETS" '. as $c | [$want[] | select($c[.] == null)] | join(", ")' catalog.json)"
          if [ -n "$unknown" ]; then
            echo "unknown package targets: $unknown" >&2
            jq -r '"known targets: " + (keys | join(", "))' catalog.json >&2
            exit 1
          fi

          matrix="$(jq -c --argjson want "$TARGETS" '. as $c | [$want[] | $c[.]]' catalog.json)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "building: $matrix"

  build:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Work out the version being built
        id: version
        shell: bash
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: matrix.kind != 'arch'
        with:
          node-version: '22'
          cache: npm

      # arch brings its own toolchain inside the container sandbox
      - name: Install the libraries tauri builds against
        if: startsWith(matrix.os, 'ubuntu') && matrix.rust
        timeout-minutes: 15
        uses: ./.github/actions/apt-deps
        with:
          packages: >-
            libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev librsvg2-dev
            libayatana-appindicator3-dev libasound2-dev file
            ${{ matrix.bundle == 'rpm' && 'rpm' || '' }}

      - uses: dtolnay/rust-toolchain@stable
        if: matrix.rust

      - name: Add the apple targets
        if: matrix.bundle == 'dmg'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Add the android targets
        if: matrix.kind == 'apk'
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Cache the cargo registry and build
        if: matrix.rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: pkg-${{ matrix.name }}-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: pkg-${{ matrix.name }}-${{ runner.os }}-

      # the cache carries src-tauri/target, and tauri writes its packages in
      # there, so a restore brings the previous release's packages back and the
      # collect step would upload those too
      - name: Drop any packages the cache restored
        if: matrix.rust
        shell: bash
        run: |
          rm -rf src-tauri/target/release/bundle \
                 src-tauri/target/universal-apple-darwin/release/bundle

      - name: Install the node packages
        if: matrix.rust
        run: npm ci --no-audit --no-fund

      # deb, rpm and exe

      - name: Build the ${{ matrix.name }} package
        if: matrix.kind == 'tauri' && matrix.bundle != 'dmg'
        run: npx tauri build --bundles ${{ matrix.bundle }}

      # dmg, one image covering apple silicon and intel

      - name: Build the universal macos disk image
        if: matrix.bundle == 'dmg'
        run: npx tauri build --target universal-apple-darwin --bundles dmg

      # msix, the package the microsoft store takes. Tauri has no msix bundler,
      # so the release binary is staged into a layout directory next to the
      # manifest and the store logos, and the windows sdk packs that.

      - name: Build the msix package
        if: matrix.kind == 'msix'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          $ErrorActionPreference = 'Stop'

          npx tauri build --no-bundle
          if ($LASTEXITCODE -ne 0) { throw 'tauri build failed' }

          $layout = 'dist/msix'
          New-Item -ItemType Directory -Force -Path "$layout/Assets", 'dist/packages' | Out-Null

          Copy-Item 'src-tauri/target/release/kana-trainer.exe' $layout

          foreach ($logo in 'StoreLogo', 'Square44x44Logo', 'Square71x71Logo', 'Square150x150Logo', 'Square310x310Logo') {
            Copy-Item "src-tauri/icons/$logo.png" "$layout/Assets"
          }

          $manifest = Get-Content 'packaging/msix/AppxManifest.xml.in' -Raw
          if ($manifest -match 'PARTNER_CENTER_') {
            Write-Output "::warning::packaging/msix/AppxManifest.xml.in still holds its PARTNER_CENTER_ placeholders. This msix packs, but Partner Center will reject it until they are replaced with the values from the app's Product identity page."
          }
          $manifest.Replace('@VERSION@', "$env:VERSION.0") |
            Set-Content "$layout/AppxManifest.xml" -Encoding utf8

          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter makeappx.exe -Recurse |
            Where-Object { $_.Directory.Name -eq 'x64' } |
            Sort-Object { $_.Directory.Parent.Name } |
            Select-Object -Last 1
          if (-not $makeappx) { throw 'no makeappx.exe in the windows sdk on this runner' }
          Write-Output "packing with $($makeappx.FullName)"

          & $makeappx.FullName pack /d $layout /p "dist/packages/kana-trainer-$env:VERSION-x64.msix" /o
          if ($LASTEXITCODE -ne 0) { throw 'makeappx failed' }

      # arch, built from the checkout so untagged commits package too

      - name: Build the arch package
        if: matrix.kind == 'arch'
        run: |
          mkdir -p dist/packages dist/arch/repo
          git archive HEAD | tar -x -C dist/arch/repo
          sed -e 's|^source=.*|source=()|' \
              -e '/^sha256sums=/d' \
              -e 's|cd "$srcdir/$pkgname-$pkgver"|cd "$startdir/repo"|' \
              packaging/arch/PKGBUILD > dist/arch/PKGBUILD
          docker run --rm -v "$PWD/dist/arch:/build" -w /build archlinux:base-devel bash -eux -c "
            pacman -Syu --noconfirm --needed rust nodejs npm webkit2gtk-4.1 gtk3 libayatana-appindicator
            useradd -m builder
            chown -R builder /build
            su builder -c 'makepkg --noconfirm --nodeps'
          "
          cp dist/arch/*.pkg.tar.zst dist/packages/

      # apk

      - uses: actions/setup-java@v4
        if: matrix.kind == 'apk'
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        if: matrix.kind == 'apk'

      - name: Install the android ndk
        if: matrix.kind == 'apk'
        run: |
          sdkmanager --install "ndk;27.2.12479018" "platforms;android-34" "build-tools;34.0.0"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Build the apk
        if: matrix.kind == 'apk'
        run: |
          npx tauri android init --skip-targets-install
          sh scripts/android-icons.sh
          npx tauri android build --apk

      # Android will not install an unsigned release apk, and it refuses to
      # update an installed one whose signing certificate has changed, so every
      # release has to be signed with the same key.
      - name: Sign the apk
        if: matrix.kind == 'apk'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          REQUIRE_SIGNING_KEY: ${{ inputs.require_signing_key }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -eu

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            if [ -z "${KEYSTORE_PASSWORD:-}" ]; then
              echo "ANDROID_KEYSTORE_BASE64 is set but ANDROID_KEYSTORE_PASSWORD is not" >&2
              exit 1
            fi
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore.jks
            alias="${KEY_ALIAS:-kanatrainer}"
            STOREPASS="$KEYSTORE_PASSWORD"
            KEYPASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          elif [ "${REQUIRE_SIGNING_KEY:-false}" = true ]; then
            echo "no ANDROID_KEYSTORE_BASE64 secret. A release apk signed with a" >&2
            echo "throwaway key cannot update an installed copy, so stopping here." >&2
            exit 1
          else
            echo "::warning::no ANDROID_KEYSTORE_BASE64 secret, signing with a throwaway key; this apk can only be installed fresh, never as an update"
            alias=kanatrainer
            STOREPASS=kanatrainer
            KEYPASS=kanatrainer
            keytool -genkeypair -v -keystore keystore.jks -keyalg RSA -keysize 2048 \
              -validity 10000 -alias "$alias" -storepass "$STOREPASS" -keypass "$KEYPASS" \
              -dname "CN=Kana Trainer, O=nl.anwari, C=NL"
          fi
          export STOREPASS KEYPASS

          unsigned="$(find src-tauri/gen/android -name '*.apk' -path '*release*' | head -1)"
          [ -n "$unsigned" ] || { echo "tauri produced no release apk" >&2; exit 1; }

          tools="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          mkdir -p dist/packages
          out="dist/packages/kana-trainer-$VERSION.apk"
          "$tools/zipalign" -p -f 4 "$unsigned" aligned.apk
          "$tools/apksigner" sign --ks keystore.jks --ks-pass env:STOREPASS \
            --ks-key-alias "$alias" --key-pass env:KEYPASS --out "$out" aligned.apk
          # the fingerprint has to match every previous release, print it so a
          # mismatch can be spotted in the log
          "$tools/apksigner" verify --print-certs "$out"
          rm -f keystore.jks aligned.apk

      - name: Collect the package
        shell: bash
        run: |
          mkdir -p out
          shopt -s nullglob
          files=(${{ matrix.glob }})
          if [ ${#files[@]} -eq 0 ]; then
            echo "no ${{ matrix.name }} package was produced" >&2
            exit 1
          fi
          cp "${files[@]}" out/
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.name }}
          path: out/*
          if-no-files-found: error
