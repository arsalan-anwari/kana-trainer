# Publishes packaging/repo/html, the download page, to github pages.
#
# The page is generated by scripts/publish.sh --pages and committed, so a
# deploy uploads what is in the tree.
#
# Needs Settings, Pages, Source set to "GitHub Actions" once.

name: pages

on:
  workflow_dispatch:

permissions:
  contents: read

# never let two deploys race, but let a running one finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy the download page
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packaging/repo/html

      - id: deploy
        uses: actions/deploy-pages@v4
