# Publishes docs/html, the download page, to github pages.
#
# The page is generated by scripts/build-download-page.sh and committed, so a
# deploy is just an upload of what is in the tree. The release workflow
# regenerates and commits it after every release, which lands here as a push.
#
# Needs Settings -> Pages -> Source set to "GitHub Actions" once.

name: pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/html/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# never let two deploys race, but let a running one finish so the live page is
# not left half written
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy the download page
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/html

      - id: deploy
        uses: actions/deploy-pages@v4
