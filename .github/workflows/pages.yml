# Publishes packaging/repo/html, the download page, to github pages, with
# the self-hosted F-Droid repo under fdroid/repo.
#
# The page is generated by scripts/publish.sh --pages and committed, so a
# deploy uploads what is in the tree. The F-Droid repo is not committed, it is
# unpacked from fdroid-repo.tar.gz on the latest release, which fdroid.yml builds.
#
# Needs Settings, Pages, Source set to "GitHub Actions" once.

name: pages

on:
  push:
    branches: [main]
    paths:
      - 'packaging/repo/**'
      - '.github/workflows/pages.yml'
  # redeploy with the F-Droid repo that fdroid.yml just rebuilt
  workflow_run:
    workflows: [fdroid]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# never let two deploys race, but let a running one finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy the download page
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    permissions:
      # read the F-Droid repo off the latest release
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Unpack the F-Droid repo from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p packaging/repo/html/fdroid
          gh release download --pattern fdroid-repo.tar.gz --output - | tar -xz -C packaging/repo/html/fdroid

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packaging/repo/html

      - id: deploy
        uses: actions/deploy-pages@v4
