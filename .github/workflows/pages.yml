# Publishes packaging/repo/html, the download page, to github pages, with
# the self-hosted F-Droid repo under fdroid/repo.
#
# The page is generated by scripts/publish.sh --pages and committed, so a
# deploy uploads what is in the tree. The F-Droid repo is not committed, it is
# rebuilt from the latest release's apk on every deploy.
#
# Needs Settings, Pages, Source set to "GitHub Actions" once.

name: pages

on:
  push:
    branches: [main]
    paths:
      - 'packaging/repo/**'
      - 'packaging/fdroid/**'
      - 'scripts/fdroid_repo.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# never let two deploys race, but let a running one finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy the download page
    runs-on: ubuntu-24.04
    permissions:
      # read the release apk for the F-Droid repo
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build the F-Droid repo from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
          FDROID_KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
        run: |
          [ -n "$FDROID_KEYSTORE_BASE64" ] || { echo "no FDROID_KEYSTORE_BASE64 secret, stopping" >&2; exit 1; }
          scripts/fdroid_repo.sh
          mkdir -p packaging/repo/html/fdroid
          cp -R build/fdroid/repo packaging/repo/html/fdroid/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packaging/repo/html

      - id: deploy
        uses: actions/deploy-pages@v4
