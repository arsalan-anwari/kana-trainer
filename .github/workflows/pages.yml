# Publishes packaging/repo/html, the download page, to github pages.
#
# The page is generated by scripts/publish.sh --pages and committed, so a
# deploy uploads what is in the tree.
#
# Needs Settings, Pages, Source set to "GitHub Actions" once.

name: pages

on:
  push:
    branches: [main]
    paths:
      - 'packaging/repo/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# never let two deploys race, but let a running one finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy the download page
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Ensure files are stable before archiving
      - name: Stabilize artifacts
        run: |
          # Wait briefly and verify symlinks are resolved
          sleep 2
          # Check that packaging/repo/html exists and is readable
          [ -d packaging/repo/html ] || { echo "Directory not found"; exit 1; }
          # Verify key files exist
          ls -la packaging/repo/html/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packaging/repo/html

      - id: deploy
        uses: actions/deploy-pages@v4
