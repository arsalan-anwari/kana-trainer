# Cuts a github release from a v1.2.3 tag.
#
#   1. builds every package in a matrix
#   2. runs the playwright smoke test against the built frontend
#   3. creates the release, with the changelog entry and every package attached
#   4. repoints the github pages download page at the new assets

name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 1.5.1). The tag must already exist.'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  packages:
    uses: ./.github/workflows/package-build.yml
    secrets: inherit
    with:
      targets: '["deb","rpm","arch","exe","dmg","apk"]'
      # stop the build rather than ship an apk signed with the wrong key
      require_signing_key: true

  smoke:
    name: smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install the node packages
        run: npm ci --no-audit --no-fund

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Build the frontend
        run: npm run build

      - name: Check that the app opens, a quiz starts and a sound plays
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  release:
    name: publish the release
    needs: [packages, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Collect every package
        uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: staging
          merge-multiple: true

      - name: Write the checksums
        run: |
          cd staging
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Work out which version is being released
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Read the changelog entry for this tag
        id: notes
        env:
          version: ${{ steps.version.outputs.version }}
        run: |
          awk -v version="$version" '
            $0 ~ "^## \\[?" version "\\]?" { found = 1; next }
            found && /^## / { exit }
            found && !/^\[[^][]*\]: / { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > notes.md

          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no entry for $version, stopping" >&2
            exit 1
          fi

          {
            echo
            echo '## Checksums'
            echo
            echo '```'
            cat staging/SHA256SUMS.txt
            echo '```'
          } >> notes.md
          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "kana-trainer ${{ steps.version.outputs.version }}" \
            --notes-file notes.md \
            --verify-tag \
            staging/*

  download-page:
    name: repoint the download page
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # needed to dispatch the pages deploy, which a GITHUB_TOKEN push cannot trigger
      actions: write
    steps:
      # check out main, since the page is committed there and not to the tag
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Work out which version was released
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Rebuild the download page from the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish.sh --pages "${{ steps.version.outputs.tag }}"

      - name: Commit it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- packaging/repo/html; then
            echo "the download page already points at ${{ steps.version.outputs.tag }}"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packaging/repo/html
          git commit -m 'Point the download page at ${{ steps.version.outputs.tag }}'
          git push origin main
          gh workflow run pages.yml --ref main
