# @VERSION@ and @BINARY@ are filled in by package.sh, which writes the result to
# dist/nfpm.yaml and builds from that.

name: kana-trainer
arch: amd64
platform: linux
version: "@VERSION@"
release: "1"
maintainer: Arsalan Anwari <arsalan@anwari.nl>
description: Practice hiragana and katakana with quizzes, typing drills and audio
vendor: Arsalan Anwari
homepage: https://github.com/arsalan-anwari/kana-trainer
license: Apache-2.0

depends:
  - webkit2gtk-4.1
  - gtk3
  - libayatana-appindicator

contents:
  - src: "@BINARY@"
    dst: /usr/bin/kana-trainer
    file_info:
      mode: 0755

  - src: ./packaging/linux/nl.anwari.kanatrainer.desktop
    dst: /usr/share/applications/nl.anwari.kanatrainer.desktop

  - src: ./packaging/linux/nl.anwari.kanatrainer.metainfo.xml
    dst: /usr/share/metainfo/nl.anwari.kanatrainer.metainfo.xml

  - src: ./src-tauri/icons/128x128.png
    dst: /usr/share/icons/hicolor/128x128/apps/nl.anwari.kanatrainer.png

  - src: ./src-tauri/icons/32x32.png
    dst: /usr/share/icons/hicolor/32x32/apps/nl.anwari.kanatrainer.png

  - src: ./LICENSE
    dst: /usr/share/licenses/kana-trainer/LICENSE
