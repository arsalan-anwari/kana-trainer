name: kana-trainer
base: core24
version: "1.0.0"
summary: Practice hiragana and katakana
description: |
  Kana Trainer drills hiragana and katakana with multiple choice quizzes,
  typing drills and recorded character sounds. Pick single characters or whole
  rows, set a timer per question or for the whole run, and review score reports
  with charts that show which characters need more work.
grade: stable
confinement: strict
compression: lzo
license: Apache-2.0

apps:
  kana-trainer:
    command: usr/bin/kana-trainer
    desktop: usr/share/applications/nl.anwari.kanatrainer.desktop
    extensions: [gnome]
    plugs:
      - home
      - audio-playback
      - opengl
      - network

parts:
  build-app:
    plugin: nil
    source: .
    build-snaps:
      - node/22/stable
      - rustup/latest/stable
    build-packages:
      - libwebkit2gtk-4.1-dev
      - build-essential
      - curl
      - wget
      - file
      - libxdo-dev
      - libssl-dev
      - libayatana-appindicator3-dev
      - librsvg2-dev
      - libasound2-dev
    stage-packages:
      - libwebkit2gtk-4.1-0
      - libayatana-appindicator3-1
    override-build: |
      set -eu
      rustup default stable
      npm install
      npm run build
      cargo build --release --manifest-path src-tauri/Cargo.toml
      install -Dm755 src-tauri/target/release/kana-trainer "$CRAFT_PART_INSTALL/usr/bin/kana-trainer"
      install -Dm644 packaging/linux/nl.anwari.kanatrainer.desktop "$CRAFT_PART_INSTALL/usr/share/applications/nl.anwari.kanatrainer.desktop"
      install -Dm644 src-tauri/icons/128x128.png "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/128x128/apps/nl.anwari.kanatrainer.png"
