# Google Play requires 16 KB memory page alignment for native libraries on
# 64-bit Android targets (enforced for new submissions since Nov 2025). The
# NDK only defaults to this with r28+; force it explicitly so an older NDK
# in CI still produces compliant .so files.
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.x86_64-linux-android]
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]
