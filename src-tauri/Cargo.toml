[package]
name = "kana-trainer"
version = "1.7.1"
edition = "2021"
rust-version = "1.77.2"
description = "Desktop trainer for hiragana and katakana with quiz, typing and audio modes"
authors = ["Arsalan Anwari <arsalan@anwari.nl>"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/arsalan-anwari/kana-trainer"
homepage = "https://github.com/arsalan-anwari/kana-trainer"
keywords = ["japanese", "hiragana", "katakana", "kana", "quiz"]
categories = ["gui"]
include = [
  "src/**/*",
  "dist/**/*",
  "icons/**/*",
  "capabilities/**/*",
  "build.rs",
  "tauri.conf.json",
  "Cargo.toml",
  "README.md",
  "LICENSE",
]

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name, which
# cargo requires on Windows. Android and iOS build this target, not the binary.
name = "kana_trainer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "kana-trainer"
path = "src/main.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dev-dependencies]
# the mock runtime, so the export and import commands can be exercised without a window
tauri = { version = "2.11.5", features = ["test"] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
# the Wayland/Nvidia startup fix, a no-op on every other target
tauri-plugin-wayland-nvidia-quirk = "0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
